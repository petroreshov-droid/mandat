[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mandat"
version = "0.1.0"
description = "Мандат: детерминированный шлюз между ИИ-агентом и брокером (T-Invest MCP)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mandat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
